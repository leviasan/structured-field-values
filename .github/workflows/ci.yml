name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: restore
        run: dotnet restore structured-field-values.slnx

      - name: build
        run: dotnet build structured-field-values.slnx --configuration Release --no-restore

      - name: test
        run: dotnet test --solution structured-field-values.slnx --configuration Release --no-build --report-xunit-junit --coverage --coverage-output-format cobertura --results-directory ./coverage

      - name: upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/**/*.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: upload test results to codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/**/*.junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
