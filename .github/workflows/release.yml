name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag ${{ github.ref_name }} must point to a commit on master"
            exit 1
          fi

      - name: verify tag matches project version
        run: |
          VERSION=$(dotnet msbuild Leviasan.StructuredFieldValues/Leviasan.StructuredFieldValues.csproj -getProperty:Version)
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match project version $VERSION"
            exit 1
          fi

      - name: restore
        run: dotnet restore structured-field-values.slnx

      - name: build
        run: dotnet build structured-field-values.slnx --configuration Release --no-restore

      - name: test
        run: dotnet test structured-field-values.slnx --configuration Release --no-build

      - name: pack
        run: dotnet pack Leviasan.StructuredFieldValues/Leviasan.StructuredFieldValues.csproj --configuration Release --no-build --output ./artifacts

      - name: nuget login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: leviasan

      - name: push to nuget.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: create github release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*
